models:
  - name: stg_jaffle_shop__customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: orders_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['shipped', 'completed', 'placed', 'return_pending', 'returned']