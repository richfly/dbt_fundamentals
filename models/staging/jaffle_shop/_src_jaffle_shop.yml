version: 2

sources:
  - name: jaffle_shop
    description: Clone of Postgres DB
    database: raw
    tables:
      - name: customers
        description: Raw customers data
        columns:
          - name: id
            description: PK
            desription: primary key
            data_tests: 
              - unique
              - not_null
      - name: orders
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 1
              period: day
          loaded_at_field: _etl_loaded_at
            